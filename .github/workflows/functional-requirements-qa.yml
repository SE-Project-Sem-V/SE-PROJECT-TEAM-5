name: Functional Requirements QA

on:
  push:
    paths:
      - "TESTING_QA_REPORT.md"
      - ".github/workflows/functional-requirements-qa.yml"
  pull_request:
    branches:
      - main
    paths:
      - "TESTING_QA_REPORT.md"
      - ".github/workflows/functional-requirements-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-requirements-testing:
    name: Backend Functional and Database Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: chatapp
          POSTGRES_PASSWORD: chatapp_test_password
          POSTGRES_DB: chatapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatapp -d chatapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend automated tests
        run: npm test

      - name: Run PostgreSQL integration tests
        run: npm run test:db
        env:
          NODE_ENV: test
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: chatapp
          PGPASSWORD: chatapp_test_password
          PGDATABASE: chatapp_dev
          TEST_PGDATABASE: chatapp_test
          DB_SSL_MODE: disable

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-requirements-qa-report
          path: TESTING_QA_REPORT.md
          if-no-files-found: warn


